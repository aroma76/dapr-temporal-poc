# Withdrawal Service Port
server.port=8081

# Temporal Configuration
temporal.target=${TEMPORAL_TARGET:127.0.0.1:7233}

# Dapr Pub/Sub Configuration
dapr.http.host=${DAPR_HTTP_HOST:localhost}
dapr.http.port=${DAPR_HTTP_PORT:3500}
dapr.pubsub.name=pubsub
dapr.direct.fallback.url=${DAPR_DIRECT_FALLBACK_URL:http://localhost:8082/events/withdrawal-requests}

# Logging
logging.level.com.bank=INFO

