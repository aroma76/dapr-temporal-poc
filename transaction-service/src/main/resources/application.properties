# Transaction Service Port
server.port=8082

# YugabyteDB (YSQL) Database Configuration
# Default YugabyteDB YSQL port is 5433
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/yugabyte}
spring.datasource.username=yugabyte
spring.datasource.password=yugabyte
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dapr Pub/Sub Configuration
dapr.http.host=${DAPR_HTTP_HOST:localhost}
dapr.http.port=${DAPR_HTTP_PORT:3501}
dapr.pubsub.name=pubsub
dapr.direct.fallback.url=${DAPR_DIRECT_FALLBACK_URL:http://localhost:8081/events/transaction-results}

# Logging
logging.level.com.bank=INFO

